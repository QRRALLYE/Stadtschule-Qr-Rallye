<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8c123d">
  <meta name="description" content="Löse eine Station der QR-Rallye an der Stadtschule.">
  <title>Station – Mission Stadtschule</title>
  <link rel="stylesheet" href="style.css?v=mission-20261102-9">
</head>
<body class="station-page">
<header class="top">
  <a class="brand" href="index.html" aria-label="Zurück zur Mission Stadtschule Startseite" data-i18n-aria-label="backHome">MISSION <span>STADTSCHULE</span></a>
  <nav class="top-links" aria-label="Hauptnavigation" data-i18n-aria-label="mainNav">
    <a href="index.html#stationen" data-i18n="navStations">Stationen</a>
  </nav>
  <div class="language-picker">
    <label for="languageSelect" data-i18n="language">Sprache</label>
    <select id="languageSelect" aria-label="Sprache auswählen" data-i18n-aria-label="languageSelect">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="ru">Русский</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="tr">Türkçe</option>
    </select>
  </div>
  <details class="settings-menu">
    <summary data-i18n-aria-label="settingsOpen" data-i18n-title="settingsOpen" aria-label="Einstellungen öffnen" title="Einstellungen öffnen">⚙️</summary>
    <div class="settings-panel">
      <strong data-i18n="settingsTitle">ANSICHT &amp; TON</strong>
      <label for="siteBrightness" data-i18n="brightness">Bildschirmhelligkeit</label>
      <div class="brightness-control"><input id="siteBrightness" type="range" min="80" max="120" value="105"><output id="brightnessValue" for="siteBrightness">105%</output></div>
      <label for="soundVolume" data-i18n="soundVolume">Lautstärke</label>
      <div class="brightness-control"><input id="soundVolume" type="range" min="0" max="100" value="80"><output id="soundVolumeValue" for="soundVolume">80%</output></div>
      <label class="settings-toggle" for="soundEffects"><input id="soundEffects" type="checkbox" checked><span data-i18n="soundEffects">Klicksounds</span></label>
      <fieldset class="layout-mode-setting">
        <legend data-i18n="deviceModeTitle">Gerätegröße</legend>
        <div class="layout-mode-options">
          <label class="layout-mode-option"><input type="radio" name="layoutMode" value="auto" checked><span data-i18n="deviceModeAuto">Auto</span></label>
          <label class="layout-mode-option"><input type="radio" name="layoutMode" value="phone"><span data-i18n="deviceModePhone">Telefon</span></label>
          <label class="layout-mode-option"><input type="radio" name="layoutMode" value="tablet"><span data-i18n="deviceModeTablet">Tablet</span></label>
        </div>
      </fieldset>
    </div>
  </details>
  <div id="stationNumber" class="badge">STATION</div>
</header>

<main class="station-wrap">
  <div id="stationCard" class="station-card"></div>
</main>

<div class="page-stickers" aria-hidden="true"><span>📚</span><span>✏️</span><span>⭐</span><span>🏫</span></div>

<footer class="site-footer">
  <a class="text-link" href="index.html" data-i18n="backOverview">← Zurück zur Übersicht</a>
  <span data-i18n="progressSaved">Dein Fortschritt wird auf diesem Gerät gespeichert.</span>
</footer>

<details class="quick-emoji-game">
  <summary data-i18n-aria-label="emojiGameOpen" data-i18n-title="emojiGameOpen" aria-label="Emoji-Spiel öffnen" title="Emoji-Spiel öffnen">🎮</summary>
  <div class="quick-game-panel">
    <strong data-i18n="emojiGameTitle">DIE EMOJI-MISSION</strong>
    <p data-i18n="emojiGameQuestion">Welches Emoji gehört zu unserer Schule?</p>
    <div class="emoji-choices" role="group" aria-label="Emoji-Spiel">
      <button type="button" data-emoji-choice="🌳" data-i18n-aria-label="emojiTree" aria-label="Baum" aria-pressed="false">🌳</button>
      <button type="button" data-emoji-choice="🏫" data-i18n-aria-label="emojiSchool" aria-label="Schule" aria-pressed="false">🏫</button>
      <button type="button" data-emoji-choice="⚽" data-i18n-aria-label="emojiFootball" aria-label="Fußball" aria-pressed="false">⚽</button>
    </div>
    <p id="emojiGameMessage" class="emoji-game-message" role="status" aria-live="polite"></p>
  </div>
</details>

<script src="script.js?v=mission-20261102-9"></script>
</body>
</html>
